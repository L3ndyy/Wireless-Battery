name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default: builds of pull requests cannot change the repository or releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits so a moved tag cannot swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build WirelessBattery.exe
        shell: msys2 {0}
        run: make

      - name: Test Rapoo protocol and driver
        shell: msys2 {0}
        run: make test

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          ./installer/build-installer.ps1 -Version $version

      - name: Fetch HeadsetControl source (GPL corresponding source for the bundled binary)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-4.3.0.tar.gz -OutFile dist/headsetcontrol-4.3.0.tar.gz
          if ((Get-FileHash dist/headsetcontrol-4.3.0.tar.gz -Algorithm SHA256).Hash -ne '918dcacf8aef347744b36b2d259d76880fa64b3869f0f8ef26b6576b873d28a7') { throw 'checksum mismatch' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBattery
          path: dist/*

  # The same sources cross-compiled for Windows on ARM (Snapdragon X and friends). Only the main
  # executable is built: the installer and the portable zip stay x64, and the ARM64 binary is
  # published next to them for people who prefer it. The tests are not run here because an x64
  # runner cannot execute ARM64 code.
  build-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: make

      - name: Install llvm-mingw (ARM64 cross compiler)
        shell: pwsh
        run: |
          curl.exe -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-x86_64.zip
          Expand-Archive llvm-mingw.zip -DestinationPath .
          "LLVM_MINGW_BIN=$(Join-Path $PWD 'llvm-mingw-20261117-ucrt-x86_64\bin')" >> $env:GITHUB_ENV

      - name: Build WirelessBattery-arm64.exe
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$LLVM_MINGW_BIN"):$PATH"
          make CXX=aarch64-w64-mingw32-g++ WINDRES=aarch64-w64-mingw32-windres
          mv WirelessBattery.exe WirelessBattery-arm64.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBattery-arm64
          path: WirelessBattery-arm64.exe

  # Only this job can publish, and only for version tags pushed by the maintainer.
  release:
    needs: [build, build-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read  # the Discord announcement reads merged PR titles
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WirelessBattery
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WirelessBattery-arm64
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          append_body: true
          body: |
            Enjoying Wireless Battery? Support it on [Ko-fi](https://ko-fi.com/krisgfx), [PayPal](https://www.paypal.com/paypalme/krisgfx) or [GitHub Sponsors](https://github.com/sponsors/krisgfx9).

      # Announce the release on Discord: first what changed, then the newly supported devices.
      # The webhook lives in the DISCORD_WEBHOOK repository secret, never in the code. A failed post
      # does not fail the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Announce on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discord-release.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
